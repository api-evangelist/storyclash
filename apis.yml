apis:
- name: Storyclash API
  description: >-
    Enterprise REST API for the Storyclash influencer marketing platform. Three
    documented endpoints under https://app.storyclash.com/external-api/: GET
    /campaigns lists the authenticated customer's campaigns, GET
    /campaign/{campaign_id} returns the full campaign payload (campaign header,
    paginated posts with metrics and mentions, and creators with shop and link
    attribution data), and POST /import/creator bulk-imports creators by platform
    handle. Authenticated by a per-customer token passed as a query parameter on
    GET and as a body field on POST. One outbound webhook reports per-creator
    import outcomes against a 14-value status registry. Campaign data is
    pull-only and rate limited to one request per hour per campaign per result
    page. Built to feed BI tools (Power BI, Tableau, Looker Studio).
  humanURL: https://www.storyclash.com/integrations/api-integration
  baseURL: https://app.storyclash.com/external-api
  x-baseURL-note: >-
    Corrected 2026-08-13. Every endpoint in Storyclash's own API documentation is rooted at
    https://app.storyclash.com/external-api/ and a live unauthenticated GET on
    /external-api/campaigns returns HTTP 200 with a Storyclash JSON body. The previously
    recorded host api.storyclash.com is an AWS API Gateway (CNAME
    d-kznsfkvpob.execute-api.eu-north-1.amazonaws.com) that answers every probed path with 403
    {"message":"Missing Authentication Token"} and is named in no documentation.
  x-secondary-host: https://api.storyclash.com
