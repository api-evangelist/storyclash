aid: storyclash
name: Storyclash
description: >-
  Storyclash is an AI-powered influencer marketing software platform used by
  brands and agencies to discover creators, analyze brand and competitor
  strategies, manage collaborations in a purpose-built CRM, and measure campaign
  performance and revenue ROI across Instagram, TikTok, YouTube, and Facebook.
  Its AI-driven creator discovery includes neural visual search over 120M+
  creators, letting teams match on a reference image or product URL rather than
  keywords alone. Storyclash exposes an enterprise REST API with token-based
  authentication and real-time webhooks that streams campaign KPIs (50+ metrics
  per campaign), creator profiles, content performance, and revenue attribution
  as structured JSON into BI tools such as Power BI, Tableau, and Looker Studio.
  The company, headquartered in Linz, Austria, was surfaced as a portfolio
  company of Speedinvest and has since been acquired by Kolsquare.
