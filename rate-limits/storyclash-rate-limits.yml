exhaustion:
  status_code: null
  note: >-
    The documentation names the error MESSAGE returned on exhaustion ("Maximum results
    reached", "Rate Limit reached") but never the HTTP status. The observed auth-failure
    response returns 200 with a JSON error body, so an exhaustion response very likely does
    the same — clients must parse the body, not the status.
adjustability:
  documented: true
  detail: >-
    The public API integration page states the hourly limit is "adjustable for enterprise";
    the documentation describes rate limiting as configurable per token/campaign.
    https://www.storyclash.com/integrations/api-integration
