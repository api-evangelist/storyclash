summary: >-
  Storyclash publishes no security certification and no API standards conformance. The only
  compliance posture it states publicly is GDPR — it is an Austrian (Linz) company operating
  under EU data protection law, with a privacy policy referencing standard contractual clauses
  and a data processing agreement. No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim exists
  on any Storyclash surface; trust.storyclash.com does not resolve and /security, /trust and
  /gdpr all return 404. On the API side, the surface conforms to no cross-cutting standard:
  no OAuth2, no OpenID Connect, no RFC 9457 problem details, no RFC 8594 Sunset/Deprecation,
  no RFC 9331/RateLimit headers, no OpenAPI.
